# ============================================================
#  BotManager 配置文件
#
#  作用：让 Leaves 的 /bot 假人像普通陌生玩家一样受 Residence 领地权限约束。
#
#  原理：Leaves 的 ServerBotGameMode 覆写了原版破坏/交互逻辑，
#        把 Paper 注入的 Bukkit 事件全部跳过了，导致 Residence 收不到
#        假人的任何操作。本插件在 Leaves 的 BotActionExecuteEvent
#        （所有 bot 动作的必经入口，可取消）里，为假人的动作重建
#        对应的 Bukkit 事件，并只派发给 Residence 自己的监听器来判断。
#        因为用的是 Residence 原生判定逻辑，所以它的全部 flag 都会生效。
#
#  另有一件事是自动做的、没有开关：给假人补建 Residence 玩家档案。
#        Residence 判定 flag 前先查玩家档案，查不到就一律返回拒绝——
#        而它只在 PlayerJoinEvent 上建档，假人不触发那个事件。
#        不补的话，领地里 set 过的权限对假人全部无效（攻击/捡物品都没权限）。
#        是否生效看 /bm status 的「假人领地档案」一行。
# ============================================================

# 调试模式：在控制台打印每次被拦截的详细原因，排查问题时打开
debug: false

# 玩家级动作总开关。设为 false 等于关闭本插件的全部保护（仅用于排障）
enabled: true

# 是否把拦截消息也发给假人本身。
# 假人不会看聊天框，开启只会在后台产生无意义的消息，通常保持 false。
# 注意：这只影响"提示"，不影响拦截本身。
inform-bot: false

# 视线检测距离（格）。Leaves 的 break 动作固定用 5 格，
# 这里保持一致即可，改大不会更安全，只会让判定目标和实际不符。
reach: 5.0

# ------------------------------------------------------------
#  各类动作的保护开关
#  每一项对应假人的一类 /bot action，关掉哪项，假人在该类动作上
#  就不再受 Residence 限制（等同恢复原版漏洞行为）。
# ------------------------------------------------------------
guard:
  # 破坏方块       -> break
  #                 对应 Residence: destroy / build 及各类方块保护
  break: true

  # 右键方块       -> use_on / use_on_offhand
  #                 对应 Residence: use / container / button / door / 各类功能方块
  interact: true

  # 放置方块       -> use_on / use_on_offhand（手持方块时）
  #                 对应 Residence: place / build
  place: true

  # 使用物品       -> use / use_auto / use_offhand / use_to / use_to_offhand
  #                 对应 Residence: 桶(waterflow/lavaflow)、打火石(ignite)、
  #                 骨粉、剪刀(shear)、栓绳(leash)、喂食(animalfeeding) 等
  use-item: true

  # 攻击 / 伤害实体 -> attack
  #                 对应 Residence: pvp / damage / animalkilling / mobkilling /
  #                 friendlyfire / witherdamage 等全部战斗类 flag
  attack: true

  # 上下载具       -> mount
  #                 对应 Residence: riding / boarding / vehicledestroy
  vehicle: true

  # 丢弃物品       -> drop
  #                 对应 Residence: itemdrop
  item-drop: true

  # 钓鱼           -> fish
  #                 对应 Residence: hook
  fish: true

  # 移动 / 游泳 / 跳跃 -> move / swim / jump
  #                 对应 Residence: move / nofly / fly 等移动类 flag
  #                 注意：假人多数时候在自家领地外活动，移动类拦截会让
  #                 假人卡在领地边界。除非确实需要，建议保持关闭。
  move: false

# ============================================================
#  假人管理系统
#
#  命名：/bm spawn 召唤出的假人形如 test.1、test.2……
#        raw name 是 <玩家名>.<编号>，中间的 "." 由插件自己放。
#  编号范围是 1 到上限：不写编号的 /bm spawn 补最小的空号，
#  写了编号的 /bm spawn <编号> 允许自己挑，但编号数字不能超过上限。
#  为什么要那个点：Minecraft 的玩家名只允许 [a-zA-Z0-9_]，真人**注册不到**带点的名字，
#  所以假人的名字空间和真人彻底隔开，没人能抢注（细节见 README 8.1）。
#  Leaves 要求全名是 4-16 字符，超出会直接拒绝创建，插件会提前拦截并提示。
#  prefix / suffix 留空即可，不要配成含 "." 的形式。
#
#  归属与配额记录在 plugins/BotManager/bots.yml，不在这里改。
# ============================================================
bot:
  # 没有单独设置过上限的玩家，默认能召唤几个。
  # 这个数**同时是他的可用编号范围**：上限 5 ⇒ 只能用编号 1-5。
  # 预设 0 = 默认谁都不能召唤，需要管理员用
  #   /bm limit set <玩家> <数量>
  #   /bm limit add <玩家> <数量>      在其当前上限上增加
  #   /bm limit reduce <玩家> <数量>   在其当前上限上减少
  # 逐个放开。想让所有人都能召唤就改成 1 之类。
  default-limit: 0

  # 玩家上线时，自动把他名下的假人拉起来（有存档的还原，没存档的重新创建）。
  sync-on-join: true

  # 玩家下线时，自动把他的假人存档并移除。
  # 关掉的话假人会留在世界里继续活动，直到玩家再次上线或手动 /bm remove。
  sync-on-quit: true

  # 【说明，不是开关】假人死亡不受 keepInventory 保护。
  # Leaves 的 ServerBot.die() 整个覆写了原版，dropAll() 全程不看 keepInventory，
  # 所以服务器开着死亡不掉落时，真人死了不掉、假人死了照掉一地。
  # 这是**刻意保留**的：假人是随叫随到的"容器/劳力"，不是需要保护进度的真人。
  # 让它死了吐东西，语义才和 /bm remove 一致，也没法拿假人当"永不丢东西的保险箱"。
  # 要防玩家互相偷家请用 Residence 的 pvp/damage 等 flag，别指望 keepInventory。

  # 背包归属限制。
  # Leaves 的 modify.fakeplayer.open-fakeplayer-inventory 一旦打开，
  # 任何玩家空手右键任意假人就能翻它的背包——包括别人的假人。
  # 开着本项时，玩家只能打开自己召唤的假人的背包，
  # 拥有 botmanager.inventory.others 权限（默认 OP）的人不受限。
  # 注意：本项只是"收口"，Leaves 那边没开 open-fakeplayer-inventory 的话，
  # 本来就没人能打开假人背包，本项不起作用。
  restrict-inventory-to-owner: true

  # 关服前自动存档，保证假人的背包和位置能跨重启还原。
  #
  # 背景：Leaves 的 stopServer() 是「先清假人、再禁用插件」，而且关服那次清理
  # 走的是「掉物品、不存档」分支（save 参数直接取 Leaves 的 resident-fakeplayer，
  # 目标服配的是 false）。后果就是关服时假人背包连经验一起掉一地，
  # 重启后玩家上线时它因为没存档只能新建，于是出现在玩家脚下而不是关服时的位置。
  #
  # 开着本项时，插件会在 /stop 真正执行之前先替假人存档并收走它们，
  # 等 Leaves 再清场时列表已经空了，掉物品的分支不会触发。
  # 控制台、RCON、面板的「停止」按钮都覆盖得到（它们都是把 stop 打进标准输入）。
  # 覆盖不到的是 kill -9 这类强杀——那种情况没有任何代码能跑，
  # 只能靠玩家下线时的正常存档兜底。
  #
  # 关掉本项即恢复 Leaves 的原生行为（关服掉一地）。
  save-on-shutdown: true

  # 周期性自动存档间隔（分钟）。0 = 关闭。
  #
  # 为什么需要它：Leaves 的假人存档是两层的——
  #   world/fakeplayerdata/<uuid>.dat   单个假人的完整状态（背包、坐标、血量）
  #   world/fakeplayer.dat              「待复原名单」索引，只有 name/uuid
  # 而把假人拉上线那一步会**消费掉名单条目**，所以假人在线期间，
  # 磁盘上没有任何「它该被还原」的记录。目标服又是 resident-fakeplayer: false，
  # Leaves 自带的定时存档（saveAllResumeBots）也被一并关掉了。
  #
  # 后果是实测出来的：进程被强杀（kill -9 / 断电 / OOM）时假人**不会掉东西**，
  # 但会直接回退到上次落盘的状态，窗口不封顶——上次正常关服之后攒的东西全没。
  # 开着本项时，插件每 N 分钟把在线假人的完整状态写进磁盘，
  # 崩溃最多回退 N 分钟。**写盘时假人不下线、不掉东西、照常干活。**
  #
  # 和 save-on-shutdown 的分工：那个管正常 /stop，这个管强杀，两条建议都开。
  #
  # 代价：每 N 分钟一次同步写盘，假人数量多时略有卡顿，5 分钟通常无感。
  autosave-interval-minutes: 5

  # 【通常用不到】先看 /bm status 的「假人命名空间」一行。
  # 插件造出的假人名形如 test.1——中间那个点由插件自己放，不靠 Leaves 的前后缀。
  # 而 Minecraft 的玩家名只允许 [a-zA-Z0-9_]，真人**根本注册不到**带点的名字，
  # 命名空间彻底隔离，本项永远不会触发。
  #
  # 本项是没做隔离时的兜底（除非有人改了 LeavesBridge.SEPARATOR）：
  # 有真实玩家的名字和假人全名撞车时怎么处理。
  # 这种名字空间是重叠的，Minecraft 不允许两个同名在线，Leaves 会二选一：
  # 它自己会「删假人、留玩家」，而且删的时候不存档——假人背包里的东西
  # 会直接掉在地上。本插件的拦截点在自己的 PlayerLoginEvent 里，
  # 抢在那之前先把假人存档收走，所以两种情况都不会掉东西。
  #
  #   protect（默认）：让玩家进服，假人被存档收走。
  #                   物品安全，主人下次登录可原样恢复。
  #                   但主人会因此暂时不能用这个编号，属于被骚扰。
  #   deny：直接拒绝该玩家登录，假人原样留着。
  #        能防住恶意抢注，代价是玩家会被踢，且他永远进不来
  #        （除非主人 /bm remove 掉这个编号）。
  name-conflict: protect

# ============================================================
#  图形菜单（/bm menu）
#
#  主菜单是「仓库」式排布，格子从第 1 格起按顺序排，一格一个号位：
#    上限 0           [购买]
#    上限 2，没召唤    [可用1] [可用2] [购买]
#    上限 2，召唤了 1  [实例1] [可用2] [购买]
#  也就是：前「上限」格是号位，紧跟的那一格固定是购买按钮，其余为空。
#
#  左键点一下：
#    可用（号位在你名下但还没召唤） -> 进小面板，只有「生成假人」和「返回」
#    实例（已经召唤过，含离线）     -> 进完整操作面板（召唤 / 收回 / 移除 / 动作）
#    购买                          -> 上限 +1，那一格随即变成「可用」
#
#  购买一次只加一个上限（等价于 /bm limit add <玩家> 1）。因为购买按钮永远
#  出现在最后一个号位之后，它代表的就是下一个号位，"点哪买哪"和"加一个"
#  是同一件事，不存在跳号多收钱的情况。
# ============================================================
menu:
  # ----------------------------------------------------------
  #  菜单里最多能买到第几个号位
  #
  #  玩家在菜单里点「购买」最多买到这一格，再往后购买按钮会变成
  #  「已达上限」，点不动。
  #
  #  ⚠️ 它只管**菜单购买**这条路。管理员用
  #     /bm limit add <玩家> <数量>
  #     照样能把上限抬到更高（那是管理操作，不是消费行为）。抬过头之后
  #     玩家的号位照常能用，只是菜单里的购买按钮一直显示「已达上限」。
  #
  #  想加长就调大这个数，同时记得把下面的 price-list 也接上对应档位，
  #  否则超出表长的档位会拿表里最后一项继续按 price-growth 乘。
  # ----------------------------------------------------------
  max-slots: 5

  # ----------------------------------------------------------
  #  价格：逐级增长
  #
  #  价钱按**号位**算，号位就是假人编号——第 1 格永远是第 1 档价，
  #  第 3 格永远是第 3 档价。想配成 5万 / 10万 / 20万 / 30万 / 50万……有两种写法：
  #
  #   写法 A（涨法有规律，两行搞定）：
  #     price-per-slot: 50000
  #     price-growth: 2.0
  #
  #   写法 B（涨法不规则，直接列）：
  #     price-list:
  #       - 50000
  #       - 100000
  #       - 200000
  #       - 300000
  #       - 500000
  #
  #  价格表优先。表用完之后的号位，拿表里最后一项继续按 price-growth 往上乘
  #  （写法 B 配 growth: 1.0 就是"表外不再涨，一直按最后一项收"）。
  #
  #  全 0 = 免费解锁，不需要装经济插件；有任意一档大于 0 就需要
  #  Vault + 一个经济插件，缺了会在启动时警告。
  #
  #  ⚠️ 价格跟着号位走，不跟着"买过几次"走。所以你用
  #     /bm limit add <玩家> <数量>
  #     白送出去的上限也会占掉前几档：白送 3 个之后，玩家第一次掏钱买的是
  #     第 4 格、按第 4 档价收。想让白送的不占档位，就用写法 B 把表列长一点，
  #     或者干脆别用 /bm limit，统一走菜单购买。
  #
  #  列表里的数字是"服务器货币单位"，显示时交给经济插件自己格式化。
  # ----------------------------------------------------------

  # 第 1 个号位的价格（没配 price-list 时，也是整条价格曲线的底价）。
  price-per-slot: 0.0

  # 每往后一个号位，价格乘以这个倍数。
  #   2.0 = 每格翻倍：50000 -> 100000 -> 200000 -> 400000 ...
  #   1.5 = 每格 +50%：50000 -> 75000 -> 112500 ...
  #   1.0 = 不涨，每格一个价
  # 写小于 1 的数会被当成 1——本项只用来涨价，越买越便宜多半是配错了。
  # 只在 price-list 用完（或没配）之后才轮得到它。
  price-growth: 1.0

  # 显式价格表，第 n 项就是第 n 个号位的价。留空 [] 表示不用表。
  # 表里的项数不用跟 max-slots 一样多，多出来的号位按 price-growth 续算。
  price-list:
    - 50000
    - 100000
    - 200000
    - 300000
    - 500000
